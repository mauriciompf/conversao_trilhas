<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversão de trilhas</title>

    <meta
      name="description"
      content="Apresentação da disciplina de Conversão de trilhas da UNIASSELVI"
    />
    <meta
      name="keywords"
      content="Trilha de aprendizagem, Conversão de trilhas, Uniasselvi, EAD, Ensino Superior, Ciências Humanas, Apresentação"
    />

    <link rel="icon" type="image/png" href="/img/favicon32x32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
      />
    </noscript>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/var_humanas.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/background.css" />
    <link rel="stylesheet" href="/placeholder_4etapas/css/style.css" />
    <link rel="stylesheet" href="index.css" />

    <!-- JS -->
    <script defer src="/js/progressbar.min.js"></script>
    <script defer src="/js/main.js"></script>
    <script src="/js/lazysizes.min.js"></script>

    <script type="module" src="/src/core/main.ts"></script>
  </head>
  <body class="h-screen">
    <!-- NEW CONFIG -->
    <aside class="config font-display grid h-screen items-center px-5 pt-16">
      <div class="mx-auto grid max-w-[780px] gap-7">
        <header>
          <h1 class="text-3xl font-bold tracking-wide">
            Conversor de Trilha de Aprendizagem
          </h1>

          <p class="text-xl">
            Arraste o Word da disciplina, confira os dados e baixe a pasta
            pronta (HTML + imagens).
          </p>
        </header>

        <!-- Add file -->
        <div class="grid gap-3">
          <form
            class="cursor-pointer rounded-2xl border-2 border-dashed select-none"
          >
            <label
              class="grid h-full w-full cursor-pointer gap-2 px-3 py-14 text-center"
              for="arquivo"
            >
              <span class="text-4xl">📄</span>
              <strong>
                Arraste o arquivo .docx aqui ou clique para escolher
              </strong>
              <span class="text-sm">
                Somente
                <span class="italic">Roteiro de Trilha de Aprendizagem</span>
                em formato <strong class="text-blue-600">word</strong>
              </span></label
            >
            <input
              type="file"
              accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              class="hidden"
              id="arquivo"
            />
          </form>

          <div class="flex gap-2 select-none">
            <button
              disabled="true"
              class="removeFileBtn flex-1 cursor-not-allowed rounded-2xl border border-red-500 py-4 font-bold opacity-50"
            >
              Excluir arquivo
            </button>
            <button
              disabled="true"
              class="downloadBtn flex-1 cursor-not-allowed rounded-2xl bg-[#eead2d] font-bold opacity-50"
            >
              Baixar trilha (.zip)
            </button>
          </div>
        </div>

        <form class="inputData grid hidden grid-cols-2 gap-2">
          <div class="col-span-1 grid gap-1">
            <label class="text-sm italic" for="modelo">
              Modelo da disciplina
            </label>
            <input
              class="rounded-lg border px-2.5 py-3"
              type="text"
              readonly
              id="modelo"
            />
          </div>

          <div class="col-span-1 grid gap-1">
            <label class="text-sm italic" for="codDisciplina">
              Código da disciplina
            </label>
            <input
              class="rounded-lg border px-2.5 py-3"
              type="text"
              readonly
              id="codDisciplina"
            />
          </div>

          <div class="col-span-2 grid gap-1">
            <label class="text-sm italic" for="nameDisciplina">
              Nome da disciplina
            </label>
            <input
              class="rounded-lg border px-2.5 py-3"
              type="text"
              readonly
              id="nameDisciplina"
            />
          </div>

          <div class="col-span-2 grid gap-1">
            <label class="text-sm italic" for="folderName">
              Nome da pasta / do .zip (edite se quiser)
            </label>
            <input
              maxlength="56"
              class="rounded-lg border px-2.5 py-3"
              type="text"
              id="folderName"
            />
          </div>

          <div class="col-span-full pt-5 text-center text-xl">
            <span>👇</span>
          </div>
        </form>

        <footer class="fixed bottom-6 left-6 w-[200px] max-xl:hidden">
          <p class="text-center text-sm">
            Ferramenta interna · conversão semiautomática cobre o padrão comum
            do documento; revise os trechos marcados com
            <strong>REVISAR</strong> no HTML antes de publicar.
          </p>
        </footer>
      </div>
    </aside>

    <!-- Host -->
    <main>
      <aside
        class="fixed right-10 bottom-10 grid size-20 cursor-pointer items-center rounded-full bg-black"
      >
        <button
          class="gotoTop size-full cursor-pointer rounded-full text-4xl! select-none"
          title="Ir ao topo da página"
          aria-label="Ir ao topo da página"
        >
          ☝️
        </button>
      </aside>
      <div class="content-text reset-element"></div>
    </main>
  </body>
</html>
