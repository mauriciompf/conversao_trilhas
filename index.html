  <body class="font-display">
    <!-- NEW CONFIG -->
    <aside class="px-[20px] pt-[22px] pb-[80px]">
      <div class="mx-auto grid max-w-[880px] gap-7">
        <header>
          <h1 class="text-3xl font-bold">
            Conversor de Trilha de Aprendizagem
          </h1>

          <p class="text-xl">
            Arraste o Word da disciplina, confira os dados e baixe a pasta
            pronta (HTML + imagens).
          </p>
        </header>

        <!-- Add file -->
        <form
          class="cursor-pointer rounded-2xl border-2 border-dashed px-3 py-8"
        >
          <label class="grid gap-2 text-center" for="arquivo">
            <span class="text-4xl">📄</span>
            <strong>
              Arraste o arquivo .docx aqui ou clique para escolher
            </strong>
            <span class="text-sm">
              Só funciona com o Roteiro de Trilha de Aprendizagem em .docx
            </span></label
          >
          <input
            type="file"
            accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            class="hidden"
            id="arquivo"
          />
        </form>

        <footer>
          <p class="text-center text-sm">
            Ferramenta interna · conversão automática cobre o padrão comum do
            documento; revise os trechos marcados com REVISAR no HTML antes de
            publicar.
          </p>
        </footer>
      </div>
    </aside>
